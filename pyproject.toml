[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pwn-my-sign"
version = "0.1.0"
description = "Small composable tools for sending custom content to a Dory e-paper sign"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13.6"
dependencies = ["bleak==3.0.1", "pillow>=11,<13", "click>=8,<9", "pydantic>=2,<3"]

[project.scripts]
mysign = "greg_mitchell.pwn_my_sign.cli.mysign:main"

[project.optional-dependencies]
investigation = ["opencv-python-headless>=4.10,<5", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>5", "ruff>0.2.1", "ty", "poethepoet", "pre-commit>=4.6.0"]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
"greg_mitchell.pwn_my_sign" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["private", "scripts/investigation"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP006"]

[tool.ruff.lint.isort]
known-first-party = ["greg_mitchell"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -vv"
log_cli = true
log_cli_level = "WARN"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.poe.tasks]
lint = "ruff check"
format = "ruff format"
typecheck = "ty check"
test = "pytest"
check-all = { sequence = ["lint", "typecheck", "test"], ignore_fail = false }
fix-all = { sequence = ["lint --fix", "format"], ignore_fail = false }

[tool.uv]
exclude-newer = "14 days"
